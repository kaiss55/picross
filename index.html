<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Offline Picross 100</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#333333">
</head>
<body>
  <div id="app">
    <header>
      <button id="prev-btn">◀ 上一關</button>
      <h1 id="level-title" style="font-size: 20px; margin: 0;">Level 1</h1>
      <button id="next-btn">下一關 ▶</button>
    </header>

    <div class="status-bar">
      <div id="lives-container">生命: ❤️❤️❤️❤️❤️</div>
      <button id="reset-btn">重置關卡</button>
    </div>

    <div class="controls-top">
      <button id="mode-fill" class="mode-btn active">■ 塗黑</button>
      <button id="mode-cross" class="mode-btn">❌ 標記</button>
    </div>

    <main id="game-container">
      <div id="board"></div>
    </main>

    <div id="status-msg"></div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW register failed:', err));
      });
    }
  </script>
</body>
