<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Offline Picross 100</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#333333">
</head>
<body>
  <div id="app">
    <header>
      <button id="prev-btn">◀</button>
      <h1 id="level-title">Level 1</h1>
      <button id="next-btn">▶</button>
    </header>

    <div class="controls-top">
      <button id="mode-btn" class="active-fill">當前模式：填滿 (FILL)</button>
      <button id="reset-btn">重置</button>
    </div>

    <main id="game-container">
      <div id="board"></div>
    </main>

    <div id="status-msg"></div>
  </div>

  <script src="app.js"></script>
  <script>
    // 註冊 Service Worker 以實現 100% 離線遊玩
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW 註冊成功！'))
          .catch(err => console.log('SW 註冊失敗:', err));
      });
    }
  </script>
</body>
</html>
